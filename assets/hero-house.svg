<svg width="640" height="720" viewBox="0 0 640 720" xmlns="http://www.w3.org/2000/svg">
  <rect width="640" height="720" fill="#FAF6EF"/>

  <!-- sky/back wash -->
  <rect x="0" y="0" width="640" height="720" fill="#F1EBDE"/>

  <!-- ground -->
  <rect x="0" y="560" width="640" height="160" fill="#E4DCC9"/>

  <!-- back hedge line -->
  <rect x="0" y="520" width="640" height="46" fill="#C9C2AF" opacity="0.5"/>

  <!-- house body -->
  <rect x="120" y="330" width="400" height="230" fill="#FFFFFF" stroke="#0B0B3B" stroke-width="4"/>

  <!-- roof -->
  <polygon points="90,340 320,190 550,340" fill="#0B0B3B"/>
  <polygon points="90,340 320,190 550,340" fill="none" stroke="#0B0B3B" stroke-width="4"/>

  <!-- chimney -->
  <rect x="430" y="220" width="34" height="90" fill="#0B0B3B"/>

  <!-- door -->
  <rect x="290" y="440" width="60" height="120" fill="#E8552B"/>
  <circle cx="337" cy="500" r="4" fill="#FAF6EF"/>

  <!-- door frame -->
  <rect x="286" y="436" width="68" height="128" fill="none" stroke="#0B0B3B" stroke-width="4"/>

  <!-- left window -->
  <rect x="160" y="400" width="80" height="80" fill="#F3A183" stroke="#0B0B3B" stroke-width="4"/>
  <line x1="200" y1="400" x2="200" y2="480" stroke="#0B0B3B" stroke-width="3"/>
  <line x1="160" y1="440" x2="240" y2="440" stroke="#0B0B3B" stroke-width="3"/>

  <!-- right window -->
  <rect x="400" y="400" width="80" height="80" fill="#F3A183" stroke="#0B0B3B" stroke-width="4"/>
  <line x1="440" y1="400" x2="440" y2="480" stroke="#0B0B3B" stroke-width="3"/>
  <line x1="400" y1="440" x2="480" y2="440" stroke="#0B0B3B" stroke-width="3"/>

  <!-- porch step -->
  <rect x="260" y="560" width="120" height="14" fill="#0B0B3B"/>

  <!-- path -->
  <polygon points="300,574 340,574 380,640 260,640" fill="#C9C2AF"/>

  <!-- small tree -->
  <circle cx="90" cy="470" r="46" fill="#B9491F" opacity="0.85"/>
  <rect x="82" y="500" width="16" height="60" fill="#7A7566"/>

  <!-- shrub -->
  <circle cx="540" cy="530" r="30" fill="#B9491F" opacity="0.7"/>
  <circle cx="500" cy="545" r="22" fill="#B9491F" opacity="0.7"/>

  <!-- sold sign -->
  <rect x="470" y="470" width="6" height="90" fill="#7A7566"/>
  <rect x="440" y="470" width="70" height="40" fill="#E8552B" stroke="#0B0B3B" stroke-width="3"/>
</svg>
